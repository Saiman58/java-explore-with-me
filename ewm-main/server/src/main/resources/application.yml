server:
  port: 8080

spring:
  application:
    name: ewm-main

    datasource:
      url: jdbc:h2:mem:maindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password: ""
      driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

      stats-server:
        url: http://localhost:9090  # ← ДОБАВЬТЕ ЭТУ СТРОКУ!

logging:
  level:
    level:
  # Ваши пакеты
  ru.practicum.explorewithme.server: DEBUG
  ru.practicum.explorewithme.server.service: DEBUG
  ru.practicum.explorewithme.server.service.client: DEBUG
  ru.practicum.explorewithme.server.controller: DEBUG

  # Spring
  org.springframework.web: DEBUG
  org.springframework.transaction: DEBUG

  # Hibernate SQL
  org.hibernate.SQL: DEBUG
  org.hibernate.type.descriptor.sql.BasicBinder: TRACE